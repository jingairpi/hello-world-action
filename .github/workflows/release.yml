name: Release CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, exactly vMAJOR.MINOR.PATCH (for example v1.12.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jingairpi/hello-world-action' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be vMAJOR.MINOR.PATCH with no leading zeroes. Select a new unused version."
            exit 1
          fi

      - name: Checkout the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Build and run all tests
        run: |
          npm ci
          npm run build
          npm test

      - name: Preserve the tested bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the same source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve this run's tested bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true

      - name: Publish a new tag and immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash .github/scripts/publish-release.sh
