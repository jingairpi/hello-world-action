name: Dependabot auto review and merge

on:
  # Dependabot pull_request events support explicit token permissions;
  # pull_request_target tokens are forced read-only for these bot-authored PRs.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-merge:
    if: >-
      github.repository == 'jingairpi/hello-world-action' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This privileged workflow never checks out or executes PR code.
      - name: Verify Dependabot and fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve patch and minor updates and enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            --method POST \
            --field event=APPROVE \
            --field commit_id="$PR_SHA" \
            --field body='Verified Dependabot patch/minor update. Merge requires the protected CI check to pass.'
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_SHA"
