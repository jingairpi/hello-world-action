name: Dependabot auto review and merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-merge:
    if: >-
      github.repository == 'jingairpi/hello-world-action' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    permissions:
      contents: write
      pull-requests: write
    # The called workflow and its action pins come from protected main, not
    # the PR merge commit. Do not replace this with a local workflow reference.
    uses: jingairpi/hello-world-action/.github/workflows/dependabot-approval.yml@main
