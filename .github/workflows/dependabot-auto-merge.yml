name: Dependabot auto review and merge
on:
  workflow_run:
    workflows: [Test Action]
    types: [completed]
permissions: {}
concurrency:
  group: dependabot-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  approve-and-merge:
    if: >-
      github.repository == 'jingairpi/hello-world-action' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # The workflow and policy script come from this exact trusted main revision.
      # Never fetch PR code or CI artifacts in this privileged job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify successful CI and approve and merge its exact PR head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { approveAndMerge } = require('./.github/scripts/dependabot-policy.cjs');
            await approveAndMerge({ github, context, core });
