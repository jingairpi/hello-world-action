name: Test Action
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the trusted Dependabot policy
        run: node --test .github/scripts/dependabot-policy.test.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build the proposed action
        run: npm run build

      - name: Test the built action
        run: npm test

      - name: Run hello-world action
        id: greeting
        uses: ./
        with:
          who-to-greet: Dependabot CI

      - name: Verify greeting output
        env:
          GREETING_TIME: ${{ steps.greeting.outputs.time }}
        run: |
          [[ "$GREETING_TIME" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\ GMT[+-][0-9]{4}\ \(.+\)$ ]]

      - name: Run with the default input
        id: default-greeting
        uses: ./

      - name: Verify default greeting output
        env:
          GREETING_TIME: ${{ steps.default-greeting.outputs.time }}
        run: |
          [[ "$GREETING_TIME" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\ GMT[+-][0-9]{4}\ \(.+\)$ ]]
