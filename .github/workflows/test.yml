name: Test Action
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the proposed action
        run: npm run build

      - name: Run hello-world action
        id: greeting
        uses: ./
        with:
          who-to-greet: Dependabot CI

      - name: Verify greeting output
        env:
          GREETING_TIME: ${{ steps.greeting.outputs.time }}
        run: test -n "$GREETING_TIME"
